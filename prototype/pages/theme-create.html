<body class="min-h-screen font-sans antialiased">
    <main>
    <div class="app-shell" data-viewport-mode="app-shell">

      <!-- Window Titlebar -->
      <div class="ds-wbtitlebar">
        <div class="ds-wbtitlebar__left">
          <div class="ds-wbtitlebar__lights">
            <span class="ds-wbtitlebar__light ds-wbtitlebar__light--close"></span>
            <span class="ds-wbtitlebar__light ds-wbtitlebar__light--min"></span>
            <span class="ds-wbtitlebar__light ds-wbtitlebar__light--max"></span>
          </div>
          <span class="ds-wbtitlebar__mode-chip">刻意练习</span>
          <div class="ds-wbtitlebar__project-selector">
            <span>新建主题</span>
            <img src="../assets/icons/dl_builtin_trae/chevron-down.svg" width="12" height="12" alt="" class="icon" />
          </div>
        </div>
        <div class="ds-wbtitlebar__right">
          <a class="ds-btn ds-btn--tertiary ds-btn--sm" href="home-empty.html" data-dom-id="btn-cancel-create">
            <img src="../assets/icons/dl_builtin_trae/x.svg" width="14" height="14" alt="" class="icon" />
            取消
          </a>
        </div>
      </div>

      <!-- Activity Rail -->
      <div class="ds-activityrail">
        <a class="ds-activityrail__btn is-active" href="home-empty.html" data-dom-id="rail-home" aria-label="今天" title="今天">
          <img src="../assets/icons/dl_builtin_trae/home.svg" width="16" height="16" alt="" />
        </a>
        <a class="ds-activityrail__btn" href="#" aria-label="我的主题" title="我的主题">
          <img src="../assets/icons/dl_builtin_trae/layers.svg" width="16" height="16" alt="" />
        </a>
        <a class="ds-activityrail__btn" href="#" aria-label="日历" title="日历">
          <img src="../assets/icons/dl_builtin_trae/calendar.svg" width="16" height="16" alt="" />
        </a>
        <div class="ds-activityrail__divider"></div>
        <div class="ds-activityrail__spacer"></div>
        <a class="ds-activityrail__btn" href="#" aria-label="设置" title="设置">
          <img src="../assets/icons/dl_builtin_trae/settings.svg" width="16" height="16" alt="" />
        </a>
      </div>

      <!-- Main Content -->
      <div class="app-main overflow-y-auto" data-scroll-region="primary">
        <div class="create-page">

          <!-- Lightweight Stepper -->
          <div class="create-stepper" aria-label="创建步骤">
            <span class="create-stepper__item is-current">信息</span>
            <span class="create-stepper__sep">·</span>
            <span class="create-stepper__item">阶梯</span>
            <span class="create-stepper__sep">·</span>
            <span class="create-stepper__item">资料</span>
            <span class="create-stepper__sep">·</span>
            <span class="create-stepper__item">计划</span>
          </div>

          <!-- Title -->
          <div class="create-head">
            <h1 class="create-title">主题信息</h1>
            <p class="create-subtitle">给主题起个名字，选择类型，写一句话目标。接下来 AI 教练会帮你共创学习阶梯。</p>
          </div>

          <!-- Form -->
          <form class="create-form" onsubmit="return false;">
            <div class="form-group">
              <label class="form-label" for="theme-name">主题名</label>
              <input class="form-input" type="text" id="theme-name" value="革新学习方法" placeholder="例如：革新学习方法" />
            </div>

            <div class="form-group">
              <span class="form-label">类型</span>
              <div class="radio-group">
                <label class="radio-card">
                  <input type="radio" name="theme-type" value="general" checked />
                  <span class="radio-card__body">
                    <span class="radio-card__title">通识主题</span>
                    <span class="radio-card__desc">围绕书籍、文章、课程建立阅读能力与方法</span>
                  </span>
                </label>
                <label class="radio-card">
                  <input type="radio" name="theme-type" value="tech" />
                  <span class="radio-card__body">
                    <span class="radio-card__title">技术主题</span>
                    <span class="radio-card__desc">围绕代码、框架、工具建立可复用的工作流</span>
                  </span>
                </label>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="theme-goal">一句话目标（可选）</label>
              <input class="form-input" type="text" id="theme-goal" value="建立可持续的主题阅读方法" placeholder="例如：建立可持续的主题阅读方法" />
            </div>
          </form>

          <!-- Bottom CTA -->
          <div class="create-actions">
            <a class="ds-btn ds-btn--brand ds-btn--lg" href="theme-cocreate-stage.html" data-dom-id="btn-start-cocreate">
              <img src="../assets/icons/dl_builtin_trae/sparkles.svg" width="14" height="14" alt="" class="icon" />
              <span>进入学习阶梯共创</span>
            </a>
            <span class="create-actions__hint">下一步：AI 教练将根据主题生成 5 级学习阶梯</span>
          </div>

        </div>
      </div>

    </div>
    </main>

    <style id="page-specific">
/* Theme Create Page */
.create-page {
  max-width: 560px;
  margin: 0 auto;
  padding: 80px 32px;
  display: flex;
  flex-direction: column;
}

/* Lightweight stepper */
.create-stepper {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 11px;
  line-height: 16px;
  color: var(--text-tertiary);
}
.create-stepper__item {
  color: var(--text-tertiary);
  white-space: nowrap;
}
.create-stepper__item.is-current {
  color: var(--text-brand);
  font-weight: var(--font-weight-medium);
}
.create-stepper__sep {
  color: var(--text-tertiary);
  opacity: 0.7;
}

/* Title area */
.create-head {
  margin-top: 32px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.create-title {
  font-family: var(--heading-md-font-family);
  font-size: var(--heading-md-font-size);
  font-weight: var(--heading-md-font-weight);
  line-height: var(--heading-md-line-height);
  color: var(--text-default);
  margin: 0;
}
.create-subtitle {
  font-size: 13px;
  line-height: 20px;
  color: var(--text-secondary);
  margin: 0;
  max-width: 480px;
}

/* Form */
.create-form {
  margin-top: 32px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.form-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.form-label {
  font-size: 12px;
  font-weight: var(--font-weight-medium);
  color: var(--text-secondary);
}
.form-input {
  height: 36px;
  background: var(--bg-base-secondary);
  border: 1px solid var(--border-neutral-l1);
  border-radius: var(--radius-6);
  padding: 0 12px;
  color: var(--text-default);
  font-family: var(--body-base-font-family);
  font-size: 13px;
  line-height: 20px;
  outline: none;
  box-sizing: border-box;
  transition: border-color .12s ease, background .12s ease;
}
.form-input::placeholder {
  color: var(--text-tertiary);
}
.form-input:focus {
  border-color: var(--border-brand);
  background: var(--bg-base-default);
}

/* Radio group */
.radio-group {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.radio-card {
  padding: 16px;
  border: 1px solid var(--border-neutral-l1);
  border-radius: var(--radius-6);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 4px;
  box-sizing: border-box;
  transition: border-color .12s ease, background .12s ease;
}
.radio-card:hover {
  border-color: var(--border-neutral-l2);
}
.radio-card input {
  display: none;
}
.radio-card__body {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.radio-card__title {
  font-size: 13px;
  font-weight: var(--font-weight-medium);
  color: var(--text-default);
  transition: color .12s ease;
}
.radio-card__desc {
  font-size: 11px;
  line-height: 16px;
  color: var(--text-secondary);
}
.radio-card input:checked + .radio-card__body .radio-card__title {
  color: var(--text-brand);
}
.radio-card:has(input:checked) {
  border-color: var(--border-brand);
  background: var(--bg-brand-popup);
}

/* Bottom CTA */
.create-actions {
  margin-top: 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.create-actions__hint {
  font-size: 11px;
  line-height: 16px;
  color: var(--text-tertiary);
  text-align: right;
}

@media (max-width: 720px) {
  .app-shell { grid-template-columns: 1fr; }
  .ds-activityrail { display: none; }
  .create-page { padding: 48px 16px; }
  .radio-group { grid-template-columns: 1fr; }
  .create-actions { flex-direction: column; align-items: stretch; gap: 12px; }
  .create-actions__hint { text-align: left; }
}
    </style>
</body>
