    </style>
    <style id="component-vars">
/* Activity Rail */
    .ds-activityrail {
      display: inline-flex; flex-direction: column; align-items: center;
      gap: var(--spacer-4); width: 48px; padding: var(--spacer-8) 0;
      background: var(--bg-base-secondary); border-right: 1px solid var(--border-neutral-l1);
    }
    .ds-activityrail__btn {
      position: relative; display: inline-flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: var(--radius-8);
      background: transparent; border: none; cursor: pointer;
    }
    .ds-activityrail__btn:hover { background: var(--bg-overlay-l2); }
    .ds-activityrail__btn.is-active { background: var(--bg-overlay-l3); }
    .ds-activityrail__btn.is-active::before {
      content: ""; position: absolute; left: -8px; top: 50%; transform: translateY(-50%);
      width: 3px; height: 20px; border-radius: var(--radius-full); background: var(--bg-brand);
    }
    .ds-activityrail__divider { width: 24px; height: 1px; margin: var(--spacer-4) 0; background: var(--border-neutral-l2); }
    .ds-activityrail__spacer { flex: 1; }

/* Alert */
    .ds-alert { display: flex; gap: var(--spacer-12); padding: var(--spacer-12) var(--spacer-16); background: var(--bg-base-secondary); border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-4); color: var(--text-default); align-items: flex-start; }
    .ds-alert__icon { flex-shrink: 0; margin-top: 1px; color: var(--icon-default); display: inline-flex; }
    .ds-alert--success .ds-alert__icon { color: var(--status-success-default); }
    .ds-alert--warning .ds-alert__icon { color: var(--status-warning-default); }
    .ds-alert--danger  .ds-alert__icon { color: var(--status-error-default); }
    .ds-alert--info    .ds-alert__icon { color: var(--status-primary-default); }
    .ds-alert__title { font-weight: var(--font-weight-medium, 500); margin-bottom: var(--spacer-4); }
    .ds-alert__desc { color: var(--text-secondary); font-size: var(--body-sm-font-size); }

/* Buttons */
    .ds-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--spacer-6); padding: 0 var(--spacer-12); height: 28px; border-radius: var(--radius-4); border: 1px solid transparent; cursor: pointer; user-select: none; white-space: nowrap; font-family: var(--body-sm-strong-font-family); font-size: var(--body-sm-strong-font-size); line-height: 1; font-weight: var(--body-sm-strong-font-weight); transition: background .12s ease, color .12s ease, border-color .12s ease, opacity .12s ease; }
    .ds-btn .icon { color: currentColor; }
    .ds-btn--sm { height: 24px; padding: 0 var(--spacer-8); border-radius: var(--radius-4); font-size: var(--body-xs-font-size); }
    .ds-btn--md { height: 28px; padding: 0 var(--spacer-12); border-radius: var(--radius-4); }
    .ds-btn--lg { height: 32px; padding: 0 var(--spacer-16); border-radius: var(--radius-4); font-size: var(--body-base-font-size); }
    .ds-btn--primary { background: var(--text-default); color: var(--bg-base-default); border-color: var(--text-default); }
    .ds-btn--primary:hover { background: var(--text-default-hover); }
    .ds-btn--primary:active { background: var(--text-secondary); border-color: var(--text-secondary); }
    .ds-btn--primary[disabled] { background: var(--bg-overlay-l3); color: var(--text-tertiary); border-color: var(--border-neutral-l1); cursor: not-allowed; }
    .ds-btn--secondary { background: var(--bg-overlay-l2); color: var(--text-default); border-color: var(--border-neutral-l1); }
    .ds-btn--secondary:hover { background: var(--bg-overlay-l3); border-color: var(--border-neutral-l2); }
    .ds-btn--secondary:active { background: var(--bg-overlay-l1); }
    .ds-btn--secondary[disabled] { color: var(--text-tertiary); cursor: not-allowed; opacity: .6; }
    .ds-btn--tertiary, .ds-btn--ghost { background: transparent; color: var(--text-default); border-color: transparent; }
    .ds-btn--tertiary:hover, .ds-btn--ghost:hover { background: var(--bg-overlay-l2); }
    .ds-btn--tertiary:active, .ds-btn--ghost:active { background: var(--bg-overlay-l1); }
    .ds-btn--tertiary[disabled], .ds-btn--ghost[disabled] { color: var(--text-tertiary); cursor: not-allowed; }
    .ds-btn--danger, .ds-btn--danger-strong { background: var(--status-error-default); color: var(--special-white); border-color: var(--status-error-default); }
    .ds-btn--danger:hover, .ds-btn--danger-strong:hover { filter: brightness(0.92); }
    .ds-btn--danger:active, .ds-btn--danger-strong:active { filter: brightness(0.84); }
    .ds-btn--danger[disabled], .ds-btn--danger-strong[disabled] { opacity: .5; cursor: not-allowed; }
    .ds-btn--warning { background: var(--status-warning-default); color: var(--text-onbrand); border-color: var(--status-warning-default); }
    .ds-btn--warning:hover { filter: brightness(0.94); }
    .ds-btn--brand { background: var(--bg-brand); color: var(--text-onbrand); border-color: var(--bg-brand); }
    .ds-btn--brand:hover { background: var(--bg-brand-hover); border-color: var(--bg-brand-hover); }
    .ds-btn--brand:active { filter: brightness(0.92); }
    .ds-btn--brand[disabled] { background: var(--bg-brand-disabled, var(--bg-overlay-l3)); border-color: transparent; color: var(--text-tertiary); cursor: not-allowed; }
    .ds-btn--link { background: transparent; color: var(--text-default); border-color: transparent; padding: 0; height: auto; }
    .ds-btn--link:hover { color: var(--text-default-hover); text-decoration: underline; }
    .ds-btn--link[disabled] { color: var(--text-tertiary); text-decoration: none; cursor: not-allowed; }
    .ds-btn--icon { padding: 0; width: 28px; justify-content: center; }
    .ds-btn--icon.ds-btn--sm { width: 24px; }
    .ds-btn--icon.ds-btn--lg { width: 32px; }

/* Card */
    .ds-card { background: var(--bg-base-secondary); border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-4); padding: var(--spacer-24); }
    .ds-card__title { font-size: var(--heading-xs-font-size); line-height: var(--heading-xs-line-height); font-weight: var(--heading-xs-font-weight); margin-bottom: var(--spacer-8); }
    .ds-card__desc { font-size: var(--body-sm-font-size); line-height: var(--body-sm-line-height); color: var(--text-secondary); }

/* Checkbox */
    .ds-check { display: inline-flex; align-items: center; gap: var(--spacer-8); font-size: var(--body-sm-font-size); color: var(--text-default); cursor: pointer; user-select: none; }
    .ds-check__box { width: 14px; height: 14px; border: 1px solid var(--border-neutral-l2); background: var(--bg-overlay-l1); border-radius: var(--radius-2); display: inline-flex; align-items: center; justify-content: center; color: var(--text-onbrand); transition: background .12s, border-color .12s; flex-shrink: 0; }
    .ds-check input { display: none; }
    .ds-check input:checked + .ds-check__box { background: var(--bg-brand); border-color: var(--bg-brand); }
    .ds-check input:checked + .ds-check__box::after { content: ''; width: 8px; height: 4px; border-left: 2px solid var(--text-onbrand); border-bottom: 2px solid var(--text-onbrand); transform: rotate(-45deg) translate(1px, -1px); }
    .ds-check input:disabled + .ds-check__box { opacity: .5; cursor: not-allowed; }

/* Dialog / Modal */
    .ds-dialog { background: var(--bg-base-secondary); border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-4); width: 100%; max-width: 420px; overflow: hidden; }
    .ds-dialog__head { padding: var(--spacer-16) var(--spacer-24); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-neutral-l1); }
    .ds-dialog__title { font-size: var(--heading-xs-font-size); font-weight: var(--heading-xs-font-weight); color: var(--text-default); }
    .ds-dialog__close { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: none; color: var(--icon-secondary); cursor: pointer; border-radius: var(--radius-4); }
    .ds-dialog__close:hover { background: var(--bg-overlay-l2); color: var(--icon-default); }
    .ds-dialog__body { padding: var(--spacer-16) var(--spacer-24); color: var(--text-secondary); font-size: var(--body-sm-font-size); line-height: var(--body-sm-line-height); }
    .ds-dialog__foot { padding: var(--spacer-12) var(--spacer-24); display: flex; justify-content: flex-end; gap: var(--spacer-8); border-top: 1px solid var(--border-neutral-l1); }

/* Input */
    .ds-input { display: flex; align-items: center; gap: var(--spacer-8); padding: 0 var(--spacer-12); height: 28px; background: var(--bg-overlay-l1); border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-4); color: var(--text-default); width: 100%; font-size: var(--body-sm-font-size); line-height: 1; }
    .ds-input:focus-within { border-color: var(--border-brand); background: var(--bg-overlay-l2); }
    .ds-input input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-default); font: inherit; }
    .ds-input input::placeholder { color: var(--text-tertiary); }

/* Tag */
    .ds-tag { display: inline-flex; align-items: center; padding: 0 var(--spacer-6); height: 18px; border-radius: var(--radius-2); font-size: var(--body-xs-font-size); line-height: 1; background: var(--bg-overlay-l2); color: var(--text-secondary); border: 1px solid var(--border-neutral-l1); }
    .ds-tag--brand { background: var(--bg-brand-popup); color: var(--text-brand); }
    .ds-tag--success { background: var(--status-success-surface-l1); color: var(--status-success-default); }
    .ds-tag--warning { background: var(--status-warning-surface-l1); color: var(--status-warning-default); }
    .ds-tag--danger  { background: var(--status-error-surface-l1); color: var(--status-error-default); }

/* Workbench Titlebar */
    .ds-wbtitlebar { display: flex; align-items: center; justify-content: space-between; gap: var(--spacer-12); height: 40px; padding: 0 var(--spacer-12); background: var(--bg-base-secondary); border-bottom: 1px solid var(--border-neutral-l1); }
    .ds-wbtitlebar__left, .ds-wbtitlebar__right { display: flex; align-items: center; gap: var(--spacer-8); }
    .ds-wbtitlebar__lights { display: flex; align-items: center; gap: var(--spacer-8); margin-right: var(--spacer-8); }
    .ds-wbtitlebar__light { width: 12px; height: 12px; border-radius: var(--radius-full); }
    .ds-wbtitlebar__light--close { background: var(--status-error-default); }
    .ds-wbtitlebar__light--min { background: var(--status-alert-default); }
    .ds-wbtitlebar__light--max { background: var(--status-success-default); }

/* Slice Card */

            { id: 'a4', label: '录制讲解视频', desc: '用自己的话复述并录制 5 分钟讲解', checked: false }
          ]}
        ], history: []
      },
      {
        id: 'theme-b', name: '矛盾论', currentPhase: 'practice', is_focus: false,
        slices: [
          { phase: 'practice', status: 'active', items: [
            { id: 'b1', label: '用矛盾论分析一篇时事评论', desc: '找出主要矛盾与次要矛盾', checked: false },
            { id: 'b2', label: '完成对立统一练习题', desc: '在具体案例中识别矛盾双方', checked: true },
            { id: 'b3', label: '撰写矛盾分析短文', desc: '300 字内分析一个现实问题', checked: false }
          ]}
        ], history: [
          { phase: 'learning', status: 'completed', items: [
            { id: 'bh1', label: '阅读《矛盾论》原文', desc: '通读毛泽东《矛盾论》全文', checked: true },
            { id: 'bh2', label: '整理核心概念笔记', desc: '对立统一、主要矛盾、矛盾转化', checked: true },
            { id: 'bh3', label: '完成基础理解测试', desc: '通过自测检验基本概念掌握', checked: true }
          ]}
        ]
      }
    ];

    let selectedThemeId = 'theme-a';
    let driftRecords = [
      { time: '2026-07-27 14:32', desc: '主题「革新学习方法」被设为主焦点' }
    ];
    let pendingFocusAction = null;

    /* Helpers */
    function getTheme(id) { return themes.find(t => t.id === id); }
    function getSelectedTheme() { return getTheme(selectedThemeId); }
    function getPhaseIndex(key) { return PHASES.findIndex(p => p.key === key); }
    function countSlots(phaseKey) { return themes.filter(t => t.currentPhase === phaseKey).length; }
    function countFocus() { return themes.filter(t => t.is_focus).length; }
    function now() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    /* Render: Theme Selector */
    function renderThemeSelector() {
      const menu = document.getElementById('themeDropdownMenu');
      const label = document.getElementById('themeSelectorLabel');
      const theme = getSelectedTheme();
      label.textContent = theme.name;
      menu.innerHTML = themes.map(t => {
        const icon = t.is_focus ? 'star.svg' : 'circle.svg';
        const iconColor = t.is_focus ? 'var(--status-alert-default)' : 'var(--icon-tertiary)';
        const phaseLabel = PHASES.find(p => p.key === t.currentPhase).label;
        const activeClass = t.id === selectedThemeId ? ' is-active' : '';
        return '<div class="theme-dropdown__item' + activeClass + '" onclick="selectTheme(\'' + t.id + '\')">' +
          '<img src="../assets/icons/dl_builtin_trae/' + icon + '" width="14" height="14" alt="" style="color:' + iconColor + '">' +
          t.name +
          '<span class="text-tertiary" style="margin-left:auto;font-size:var(--body-xs-font-size);">' + phaseLabel + '期</span>' +
          '</div>';
      }).join('');
    }

    function selectTheme(id) {
      selectedThemeId = id;
      renderThemeSelector();
      renderLeftColumn();
      renderRightColumn();
      closeDropdown();
    }

    /* Dropdown */
    document.getElementById('themeSelectorBtn').addEventListener('click', function(e) {
      e.stopPropagation();
      document.getElementById('themeDropdownMenu').classList.toggle('is-open');
    });
    function closeDropdown() { document.getElementById('themeDropdownMenu').classList.remove('is-open'); }
    document.addEventListener('click', closeDropdown);

    /* Render: Phase Timeline */
    function renderTimeline() {
      const theme = getSelectedTheme();
      const currentIdx = getPhaseIndex(theme.currentPhase);
      const container = document.getElementById('phaseTimeline');
      let html = '';
      PHASES.forEach(function(phase, i) {
        const nodeClass = i === currentIdx ? ' is-active' : (i < currentIdx ? ' is-completed' : '');
        const circleClass = i === currentIdx ? ' is-active' : (i < currentIdx ? ' is-completed' : '');
        const lineClass = i < currentIdx ? ' is-completed' : '';
        const icon = i < currentIdx ? 'check.svg' : (i === currentIdx ? 'play.svg' : 'circle.svg');
        const iconColor = i === currentIdx ? 'var(--icon-onbrand)' : (i < currentIdx ? 'var(--icon-secondary)' : 'var(--icon-tertiary)');
        html += '<div class="phase-timeline__node' + nodeClass + '">' +
          '<div class="phase-timeline__circle' + circleClass + '">' +
          '<img src="../assets/icons/dl_builtin_trae/' + icon + '" alt="" style="color:' + iconColor + '">' +
          '</div>' +
          '<span class="phase-timeline__label">' + phase.label + '</span>' +
          '</div>';
        if (i < PHASES.length - 1) {
          html += '<div class="phase-timeline__line' + lineClass + '"></div>';
        }
      });
      container.innerHTML = html;
    }

    /* Render: Active Slice */
    function renderActiveSlice() {
      const theme = getSelectedTheme();
      const activeSlice = theme.slices.find(function(s) { return s.status === 'active'; });
      const container = document.getElementById('activeSliceContainer');
      if (!activeSlice) { container.innerHTML = ''; return; }
      const phaseLabel = PHASES.find(function(p) { return p.key === activeSlice.phase; }).label;
      const total = activeSlice.items.length;
      const done = activeSlice.items.filter(function(it) { return it.checked; }).length;
      const canAdvance = activeSlice.phase !== 'application';

      let itemsHtml = '';
      activeSlice.items.forEach(function(item) {
        const checkedClass = item.checked ? ' is-checked' : '';
        itemsHtml += '<div class="checklist-item' + checkedClass + '">' +
          '<label class="ds-check checklist-item__check">' +
          '<input type="checkbox" ' + (item.checked ? 'checked' : '') + ' onchange="toggleItem(\'' + theme.id + '\', \'' + item.id + '\')">' +
          '<span class="ds-check__box"></span>' +
          '</label>' +
          '<div class="checklist-item__content">' +
          '<span class="checklist-item__label">' + item.label + '</span>' +
          '<span class="checklist-item__desc">' + item.desc + '</span>' +
          '</div>' +
          '<button class="checklist-item__delete" onclick="deleteItem(\'' + theme.id + '\', \'' + item.id + '\')" title="删除">' +
          '<img src="../assets/icons/dl_builtin_trae/trash.svg" alt="trash">' +
          '</button>' +
          '</div>';
      });

      container.innerHTML =
        '<div class="slice-card">' +
        '<div class="slice-card__head">' +
        '<div class="slice-card__head-left">' +
        '<span class="slice-card__title">' + phaseLabel + '计划</span>' +
        '<span class="ds-tag ds-tag--brand">进行中</span>' +
        '</div>' +
        '<span class="mono" style="font-size:var(--body-xs-font-size);color:var(--text-tertiary);">' + done + ' / ' + total + '</span>' +
        '</div>' +
        '<div class="slice-card__body ds-stack-8">' +
        itemsHtml +
        '<div class="slice-add-row">' +
        '<button class="ds-btn ds-btn--tertiary ds-btn--sm" onclick="showAddInput(\'' + theme.id + '\')" id="addBtn_' + theme.id + '">' +
        '<img src="../assets/icons/dl_builtin_trae/plus.svg" width="12" height="12" alt="plus" class="icon">' +
        ' 添加</button>' +
        '<div class="ds-input" id="addInput_' + theme.id + '" style="display:none;">' +
        '<input type="text" placeholder="输入条目名称" id="addInputLabel_' + theme.id + '" onkeydown="handleAddKeydown(event, \'' + theme.id + '\')">' +
        '</div>' +
        '<div class="ds-input" id="addInputDesc_' + theme.id + '" style="display:none;">' +
        '<input type="text" placeholder="一句话说明（可选）" id="addInputDescVal_' + theme.id + '" onkeydown="handleAddKeydown(event, \'' + theme.id + '\')">' +
        '</div>' +
        '</div>' +
        '</div>' +
        (canAdvance ? '<div class="slice-card__foot"><button class="ds-btn ds-btn--brand" onclick="tryAdvancePhase(\'' + theme.id + '\')">' +
        '进入下一阶段 <img src="../assets/icons/dl_builtin_trae/arrow-right.svg" width="14" height="14" alt="arrow" class="icon"></button></div>' : '') +
        '</div>';
    }

    /* Render: Archive */
    function renderArchive() {
      const theme = getSelectedTheme();
      const container = document.getElementById('archiveContainer');
      if (!theme.history || theme.history.length === 0) { container.innerHTML = ''; return; }
      let html = '';
      theme.history.forEach(function(slice) {
        const phaseLabel = PHASES.find(function(p) { return p.key === slice.phase; }).label;
        let itemsHtml = '';
        slice.items.forEach(function(item) {
          itemsHtml += '<div class="checklist-item is-checked">' +
            '<label class="ds-check checklist-item__check">' +
            '<input type="checkbox" checked disabled><span class="ds-check__box"></span></label>' +
            '<div class="checklist-item__content">' +
            '<span class="checklist-item__label">' + item.label + '</span>' +
            '<span class="checklist-item__desc">' + item.desc + '</span></div></div>';
        });
        html += '<div class="archive-section">' +
          '<div class="archive-section__toggle" onclick="toggleArchive(this)">' +
          '<img src="../assets/icons/dl_builtin_trae/chevron-right.svg" alt="chevron">' +
          '<span>' + phaseLabel + '计划</span>' +
          '<span class="archive-section__badge">' +
          '<img src="../assets/icons/dl_builtin_trae/lock.svg" width="12" height="12" alt="lock" style="color:var(--icon-tertiary)">' +
          ' 已归档 · 只读</span></div>' +
          '<div class="archive-section__body"><div class="archive-section__inner ds-stack-8">' +
          itemsHtml + '</div></div></div>';
      });
      container.innerHTML = html;
    }

    function toggleArchive(el) {
      el.classList.toggle('is-open');
      el.nextElementSibling.classList.toggle('is-open');
    }

    function renderLeftColumn() { renderTimeline(); renderActiveSlice(); renderArchive(); }
    function renderRightColumn() { renderSlotOverview(); renderFocusList(); renderDriftRecords(); }

    /* Render: Slot Overview */
    function renderSlotOverview() {
      const container = document.getElementById('slotOverview');
      container.innerHTML = PHASES.map(function(phase) {
        const used = countSlots(phase.key);
        const limit = SLOT_LIMITS[phase.key];
        const pct = Math.min((used / limit) * 100, 100);
        const isFull = used >= limit;
        const occupying = themes.filter(function(t) { return t.currentPhase === phase.key; }).map(function(t) { return t.name; }).join('、');
        return '<div class="slot-card">' +
          '<div class="slot-card__row"><span class="slot-card__name">' + phase.label + '</span>' +
          '<span class="slot-card__count" style="color:' + (isFull ? 'var(--status-error-default)' : 'var(--text-secondary)') + ';">' + used + ' / ' + limit + '</span></div>' +
          '<div class="slot-card__minibar"><div class="slot-card__minibar-fill' + (isFull ? ' is-full' : '') + '" style="width:' + pct + '%"></div></div>' +
          (isFull ? '<div class="slot-card__alert"><img src="../assets/icons/dl_builtin_trae/alert-circle.svg" alt="alert"> 槽位已满，占用：' + occupying + '。请先推进到下一阶段或休眠/废弃。</div>' : '') +
          '</div>';
      }).join('');
    }

    /* Render: Focus List */
    function renderFocusList() {
      const container = document.getElementById('focusList');
      const actionArea = document.getElementById('focusActionArea');
      const focusedThemes = themes.filter(function(t) { return t.is_focus; });
      const currentTheme = getSelectedTheme();

      if (focusedThemes.length === 0) {
        container.innerHTML = '<div class="focus-empty">暂无主焦点主题</div>';
      } else {
        container.innerHTML = focusedThemes.map(function(t) {
          const phaseLabel = PHASES.find(function(p) { return p.key === t.currentPhase; }).label;
          const boldStyle = t.id === selectedThemeId ? 'font-weight:var(--font-weight-medium);' : '';
          return '<div class="focus-item">' +
            '<img src="../assets/icons/dl_builtin_trae/star.svg" width="14" height="14" alt="star" class="focus-item__star">' +
            '<span class="focus-item__name" style="' + boldStyle + '">' + t.name + '</span>' +
            '<span class="focus-item__phase">' + phaseLabel + '期</span></div>';
        }).join('');
      }

      if (currentTheme.is_focus) {
        actionArea.innerHTML = '<button class="focus-action-btn is-danger" onclick="removeFocus(\'' + currentTheme.id + '\')">取消焦点</button>';
      } else {
        actionArea.innerHTML = '<button class="focus-action-btn" onclick="trySetFocus(\'' + currentTheme.id + '\')">设为主焦点</button>';
      }
    }

    /* Render: Drift Records */
    function renderDriftRecords() {
      const container = document.getElementById('driftList');
      container.innerHTML = driftRecords.map(function(r) {
        return '<div class="drift-item"><div class="drift-item__dot"></div>' +
          '<div class="drift-item__content"><div class="drift-item__time">' + r.time + '</div>' +
          '<div class="drift-item__desc">' + r.desc + '</div></div></div>';
      }).join('');
    }

    /* Actions */
    function toggleItem(themeId, itemId) {
      const theme = getTheme(themeId);
      const slice = theme.slices.find(function(s) { return s.status === 'active'; });
      const item = slice.items.find(function(it) { return it.id === itemId; });
      if (item) { item.checked = !item.checked; renderLeftColumn(); renderRightColumn(); }
    }

    function deleteItem(themeId, itemId) {
      const theme = getTheme(themeId);
      const slice = theme.slices.find(function(s) { return s.status === 'active'; });
      slice.items = slice.items.filter(function(it) { return it.id !== itemId; });
      renderLeftColumn();
    }

    function showAddInput(themeId) {
      document.getElementById('addBtn_' + themeId).style.display = 'none';
      document.getElementById('addInput_' + themeId).style.display = 'flex';
      document.getElementById('addInputDesc_' + themeId).style.display = 'flex';
      document.getElementById('addInputLabel_' + themeId).focus();
    }

    function handleAddKeydown(e, themeId) {
      if (e.key === 'Enter') { addNewItem(themeId); }
      else if (e.key === 'Escape') { renderLeftColumn(); }
    }

    function addNewItem(themeId) {
      const labelInput = document.getElementById('addInputLabel_' + themeId);
      const descInput = document.getElementById('addInputDescVal_' + themeId);
      const label = labelInput.value.trim();
      if (!label) return;
      const desc = descInput.value.trim() || '暂无说明';
      const theme = getTheme(themeId);
      const slice = theme.slices.find(function(s) { return s.status === 'active'; });
      slice.items.push({ id: 'new_' + Date.now(), label: label, desc: desc, checked: false });
      renderLeftColumn();
      renderRightColumn();
    }

    /* Advance Phase */
    function tryAdvancePhase(themeId) {
      const theme = getTheme(themeId);
      const currentIdx = getPhaseIndex(theme.currentPhase);
      if (currentIdx >= PHASES.length - 1) return;
      const nextPhase = PHASES[currentIdx + 1];
      /* Check target phase slot limit (hard block) */
      var nextCount = countSlots(nextPhase.key);
      var nextLimit = SLOT_LIMITS[nextPhase.key];
      /* If the theme itself is already counted in the target (shouldn't be), exclude it */
      if (nextCount >= nextLimit) {
        var occupying = themes.filter(function(t) { return t.currentPhase === nextPhase.key; }).map(function(t) { return t.name; }).join('、');
        document.getElementById('modalSlotFullDesc').textContent = nextPhase.label + '期槽位已满（' + nextCount + '/' + nextLimit + '），占用：' + occupying + '。请先推进其他主题到下一阶段，或将其休眠/废弃。';
        openModal('modalSlotFull');
        return;
      }
      const currentPhaseLabel = PHASES[currentIdx].label;
      const nextPhaseLabel = nextPhase.label;
      document.getElementById('modalAdvanceTitle').textContent = '确认进入下一阶段';
      document.getElementById('modalAdvanceBody').textContent = currentPhaseLabel + '计划将归档，系统将生成' + nextPhaseLabel + '计划。归档后不可编辑。';
      document.getElementById('modalAdvanceConfirm').setAttribute('data-theme-id', themeId);
      openModal('modalAdvancePhase');
    }

    function confirmAdvancePhase() {
      const btn = document.getElementById('modalAdvanceConfirm');
      const themeId = btn.getAttribute('data-theme-id');
      const theme = getTheme(themeId);
      const currentIdx = getPhaseIndex(theme.currentPhase);
      const nextPhase = PHASES[currentIdx + 1];
      const activeSlice = theme.slices.find(function(s) { return s.status === 'active'; });
      if (activeSlice) { activeSlice.status = 'completed'; theme.history.push(activeSlice); }
      const newSlice = { phase: nextPhase.key, status: 'active', items: generateDefaultItems(theme.name, nextPhase.key) };
      theme.slices.push(newSlice);
      theme.slices = theme.slices.filter(function(s) { return s.status === 'active' || s.status === 'completed'; });
      theme.currentPhase = nextPhase.key;
      driftRecords.unshift({ time: now(), desc: '主题「' + theme.name + '」从' + PHASES[currentIdx].label + '期推进到' + nextPhase.label + '期' });
      closeModal('modalAdvancePhase');
      renderLeftColumn(); renderRightColumn(); renderThemeSelector();
    }

    function generateDefaultItems(themeName, phaseKey) {
      const ts = Date.now();
      if (phaseKey === 'application') {
        return [
          { id: 'a_' + ts + '_1', label: '在真实场景中应用「' + themeName + '」', desc: '将知识迁移到实际问题', checked: false },
          { id: 'a_' + ts + '_2', label: '完成应用项目或案例分析', desc: '综合运用所学知识', checked: false }
        ];
      }
      return [
        { id: 'p_' + ts + '_1', label: '运用「' + themeName + '」核心概念做练习', desc: '将理论知识转化为实际操作', checked: false },
        { id: 'p_' + ts + '_2', label: '完成基础练习题目', desc: '巩固核心概念的应用能力', checked: false },
        { id: 'p_' + ts + '_3', label: '记录练习中的困惑与反思', desc: '为后续深化做准备', checked: false }
      ];
    }

    /* Focus Management */
    function trySetFocus(themeId) {
      const theme = getTheme(themeId);
      const currentFocusCount = countFocus();
      if (currentFocusCount >= 3) { openModal('modalFocusError'); return; }
      if (currentFocusCount >= 1) {
        pendingFocusAction = themeId;
        document.getElementById('modalFocusWarningDesc').textContent = '当前已有 ' + currentFocusCount + ' 个主焦点。确定要将「' + theme.name + '」也设为主焦点吗？';
        openModal('modalFocusWarning');
        return;
      }
      setFocusDirectly(themeId);
    }

    function confirmFocusWarning() {
      if (pendingFocusAction) {
        const theme = getTheme(pendingFocusAction);
        driftRecords.unshift({ time: now(), desc: '多焦点警告：将「' + theme.name + '」设为主焦点，已记入计划漂移' });
        setFocusDirectly(pendingFocusAction);
        pendingFocusAction = null;
      }
      closeModal('modalFocusWarning');
      renderRightColumn(); renderThemeSelector();
    }

    function setFocusDirectly(themeId) {
      const theme = getTheme(themeId);
      theme.is_focus = true;
      if (!driftRecords.some(function(r) { return r.desc.indexOf(theme.name) !== -1 && r.desc.indexOf('主焦点') !== -1; })) {
        driftRecords.unshift({ time: now(), desc: '主题「' + theme.name + '」被设为主焦点' });
      }
      renderRightColumn(); renderThemeSelector();
    }

    function removeFocus(themeId) {
      const theme = getTheme(themeId);
      theme.is_focus = false;
      driftRecords.unshift({ time: now(), desc: '取消「' + theme.name + '」的主焦点' });
      renderRightColumn(); renderThemeSelector();
    }

    /* Modal */
    function openModal(id) { document.getElementById(id).classList.add('is-open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('is-open'); }

    /* Init */
    renderThemeSelector();
    renderLeftColumn();
    renderRightColumn();
    </script>
</body>
</html>
